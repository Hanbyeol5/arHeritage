name: Deploy API worker

# 인물 대화·유물 인식 API(worker/)를 Cloudflare Workers 에 배포한다.
# 필요한 저장소 Secrets: ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# 선택 Secrets: AZURE_SPEECH_KEY, AZURE_SPEECH_REGION (인물 목소리 — 없으면 기기 음성 사용)
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # GitHub Secret 의 키를 Worker 비밀값으로 전달 (앱 번들·저장소에는 남지 않음)
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Azure 음성 키 등록 (Secret 이 있을 때만)
        if: env.AZURE_SPEECH_KEY != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf "%s" "$AZURE_SPEECH_KEY" | npx wrangler secret put AZURE_SPEECH_KEY
          printf "%s" "$AZURE_SPEECH_REGION" | npx wrangler secret put AZURE_SPEECH_REGION
