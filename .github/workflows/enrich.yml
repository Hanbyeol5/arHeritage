name: Enrich data (LLM)

# 유적 요약·관련 인물 추출 (Claude Message Batches). 수동 실행하거나 월간 데이터 갱신 뒤 이어서 실행.
# 이미 처리한 유적·인물은 enrich/ 캐시로 건너뛴다. 필요한 Secret: ANTHROPIC_API_KEY
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '시험 삼아 처리할 최대 건수 (비우면 전체)'
        required: false
        default: ''
  workflow_run:
    workflows: [Update heritage data]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:enrich -- ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data enrich
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: LLM 보강 (유적 요약·관련 인물) $(date +%Y-%m-%d)"
            git push
          fi
