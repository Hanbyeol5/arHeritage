name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 데이터 갱신 워크플로의 커밋은 push 트리거를 발생시키지 않으므로 완료 후 이어서 배포
  workflow_run:
    workflows: [Update heritage data]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Settings > Secrets and variables > Actions > Variables 에 등록
          VITE_NAVER_MAP_KEY_ID: ${{ vars.NAVER_MAP_KEY_ID }}
          # Deploy API worker 배포 후 나오는 주소 (예: https://yeoksadam-api.<계정>.workers.dev)
          VITE_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
