name: Update heritage data

# 매월 국가유산청 데이터를 다시 수집해 변경분이 있으면 커밋한다. (완료 후 deploy 워크플로가 이어서 실행됨)
on:
  schedule:
    - cron: '0 18 1 * *' # 매월 2일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:fetch -- --region=31 --refresh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 국가유산 데이터 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
